name: Inyectar Analytics y Desplegar

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Inyectar código de Google Analytics
        run: |
          GA_CODE='<script async src="https://www.googletagmanager.com/gtag/js?id=G-B14TF44M7Z"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-B14TF44M7Z");</script>'
          find . -name "*.html" -type f -exec sed -i "s|</head>|$GA_CODE</head>|gI" {} +

      - name: Configurar entorno de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Empaquetar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en la web
        id: deployment
        uses: actions/deploy-pages@v4
