<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Infiltración - Espasmo Hemifacial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
            /* Fuerza a la impresora/PDF a mantener los colores de fondo */
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .header-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header-info label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .header-info input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .toolbar {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .tool-btn {
            padding: 10px 15px;
            border: 2px solid #ccc;
            background-color: white;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        .tool-btn.active {
            border-color: #0056b3;
            background-color: #e6f2ff;
        }
        /* Iconos de las herramientas en los botones */
        .icon-circle { display: inline-block; width: 14px; height: 14px; background-color: rgba(255, 0, 0, 0.6); border-radius: 50%; border: 1px solid red; }
        .icon-square { display: inline-block; width: 14px; height: 14px; background-color: rgba(0, 0, 255, 0.6); border: 1px solid blue; }
        .icon-cross { display: inline-block; font-weight: bold; color: green; font-size: 16px; line-height: 1; }

        .image-area {
            position: relative;
            display: inline-block;
            border: 1px solid #ddd;
            cursor: crosshair;
            max-width: 100%; /* Asegura que no se desborde al imprimir */
        }
        .image-area img {
            max-width: 100%;
            display: block;
            height: auto;
        }
        
        /* Marcas sobre la imagen */
        .marker {
            position: absolute;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
        }
        .marker.circle { background-color: rgba(255, 0, 0, 0.6); border-radius: 50%; border: 1px solid red; }
        .marker.square { background-color: rgba(0, 0, 255, 0.6); border: 1px solid blue; }
        .marker.cross { display: flex; align-items: center; justify-content: center; color: green; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 0px white, -1px -1px 0px white; }

        .footer {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .print-btn {
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        .print-btn:hover { background-color: #004494; }

        /* Estilos específicos para el PDF / Impresión */
        @media print {
            .no-print {
                display: none !important;
            }
            .header-info input {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                padding: 0;
            }
            body { margin: 0; }
            .image-area { 
                border: none; 
                page-break-inside: avoid; /* Evita que la imagen se corte a la mitad en dos páginas */
            }
        }
    </style>
</head>
<body>

    <div class="header-info">
        <div>
            <label for="doctor">Médico:</label>
            <input type="text" id="doctor" value="Dr. Juan Carlos Navarro" placeholder="Nombre del médico">
        </div>
        <div>
            <label for="paciente">Paciente:</label>
            <input type="text" id="paciente" placeholder="Nombre del paciente">
        </div>
        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha">
        </div>
    </div>

    <div class="toolbar no-print">
        <span style="font-weight: bold;">Selecciona dosis:</span>
        <button class="tool-btn" data-tool="circle" onclick="selectTool('circle')">
            <span class="icon-circle"></span> Círculo (5 UI)
        </button>
        <button class="tool-btn" data-tool="square" onclick="selectTool('square')">
            <span class="icon-square"></span> Cuadrado (2.5 UI)
        </button>
        <button class="tool-btn" data-tool="cross" onclick="selectTool('cross')">
            <span class="icon-cross">✖</span> Cruz (1.25 UI)
        </button>
        <span style="margin-left:auto; font-size: 0.9em; color: #555;">(Click en una marca para borrarla)</span>
    </div>

    <div class="image-area" id="image-container">
        <img src="Gemini_Generated_Image_k1jpcek1jpcek1jp.png" alt="Modelo anatómico" id="base-image">
    </div>

    <div class="footer">
        <div>Total Toxina Botulínica: <span id="total-ui">0.00</span> UI</div>
        <button class="print-btn no-print" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>

    <script>
        document.getElementById('fecha').valueAsDate = new Date();

        let currentTool = null;
        let totalUI = 0;
        const doses = {
            circle: 5,
            square: 2.5,
            cross: 1.25
        };

        function selectTool(toolName) {
            currentTool = toolName;
            
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.tool === toolName) {
                    btn.classList.add('active');
                }
            });
        }

        document.getElementById('image-container').addEventListener('click', function(e) {
            // Borrar marca existente
            if (e.target.classList.contains('marker')) {
                const type = e.target.dataset.type;
                totalUI -= doses[type];
                e.target.remove();
                updateTotal();
                return;
            }

            if (!currentTool) {
                alert("Por favor, selecciona primero una dosis en la barra de herramientas superior.");
                return;
            }

            // Calcular posición relativa
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // CONVERSIÓN A PORCENTAJES PARA QUE ESCALE EN LA IMPRESIÓN
            const percentX = (x / rect.width) * 100;
            const percentY = (y / rect.height) * 100;

            const marker = document.createElement('div');
            marker.className = `marker ${currentTool}`;
            marker.dataset.type = currentTool;
            
            // Aplicar posiciones en porcentaje
            marker.style.left = `${percentX}%`;
            marker.style.top = `${percentY}%`;
            
            if (currentTool === 'cross') {
                marker.innerHTML = '✖';
            }

            this.appendChild(marker);
            totalUI += doses[currentTool];
            updateTotal();
        });

        function updateTotal() {
            document.getElementById('total-ui').innerText = totalUI.toFixed(2);
        }
    </script>

</body>
</html>
