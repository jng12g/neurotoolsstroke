<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Mini-Mental (MMSE) Interactiva | NEUROTOOLS</title>
<meta name="description" content="Calculadora online del test Mini-Mental State Examination (MMSE) de Folstein adaptado al español. Herramienta interactiva para evaluar el deterioro cognitivo en consulta.">

<link rel="canonical" href="https://neurotools.es/cognitivo/mmse.html">

<meta property="og:title" content="Calculadora MMSE en español | Neurotools">
<meta property="og:description" content="Evalúa el deterioro cognitivo de forma rápida con esta calculadora interactiva del Test de Folstein automatizada para consulta clínica.">
<meta property="og:url" content="https://neurotools.es/cognitivo/mmse.html">
<meta property="og:type" content="website">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4efe4;
    font-family: Georgia, serif;
    padding: 24px 16px;
    color: #1a1614;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding: 28px 24px;
    background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
    border-radius: 20px;
    box-shadow: 0 8px 32px #1e3a5f40;
    color: #fff;
  }
  .header .sub { font-size: 11px; letter-spacing: 4px; opacity: .7; margin-bottom: 6px; font-family: monospace; }
  .header h1 { margin: 0 0 4px; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
  .header .desc { font-size: 13px; opacity: .8; }
  .header .ref { font-size: 11px; opacity: .5; margin-top: 4px; }

  /* Score bar */
  #score-bar {
    border: 2px solid #e8e1ce;
    border-radius: 16px;
    padding: 16px 24px;
    margin-bottom: 24px;
    background: #f4efe4;
    transition: background .3s, border-color .3s;
  }
  #score-bar .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #score-bar .lbl { font-size: 11px; color: #8a7d72; letter-spacing: 2px; font-family: monospace; }
  #total-num { font-size: 48px; font-weight: 900; line-height: 1.1; font-family: monospace; color: #1a1614; }
  #total-num span { font-size: 18px; opacity: .5; }
  #adj-label { border-radius: 20px; padding: 7px 18px; font-weight: 700; font-size: 15px; margin-bottom: 6px; display: inline-block; }
  #adj-cutoff { font-size: 11px; color: #8a7d72; }
  #adj-hint { font-size: 12px; color: #a89a86; max-width: 200px; text-align: right; }
  #level-chips { margin-top: 12px; border-top: 1px solid #e8e1ce; padding-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .level-chip { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #e8e1ce; color: #a89a86; font-weight: 400; transition: background .2s, color .2s; }
  .level-chip.active { color: #fff; font-weight: 700; }
  #group-label { margin-left: auto; font-size: 11px; color: #8a7d72; }

  /* Card / Section */
  .card {
    background: #faf6ec;
    border-radius: 16px;
    box-shadow: 0 1px 4px #0001, 0 4px 24px #0002;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 2px solid transparent;
  }
  .card-head .left { display: flex; align-items: center; gap: 10px; }
  .card-head h3 { margin: 0; font-size: 15px; font-weight: 800; color: #1a1614; letter-spacing: .3px; }
  .card-body { padding: 12px 20px; }

  /* Score chip */
  .chip {
    border-radius: 20px; padding: 2px 10px;
    font-size: 13px; font-weight: 700; font-family: monospace;
    min-width: 48px; display: inline-block; text-align: center;
    border: 1px solid transparent;
  }

  /* Row item */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid #ebe4d3;
  }
  .row:last-child { border-bottom: none; }
  .row .row-lbl { flex: 1; font-size: 14px; color: #4a3f38; }
  .row .row-sub { font-size: 11px; color: #a89a86; margin-top: 1px; }
  .row-btns { display: flex; gap: 6px; }

  /* Buttons */
  button { font-family: Georgia, serif; cursor: pointer; transition: all .15s; }
  .btn-01 {
    padding: 4px 14px; border-radius: 8px; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #a89a86; font-weight: 700; font-size: 13px;
  }
  .btn-01.active-ok { border-color: #22c55e; background: #22c55e15; color: #16a34a; }
  .btn-01.active-no { border-color: #ef4444; background: #ef444415; color: #dc2626; }
  .btn-eval {
    padding: 5px 14px; border-radius: 8px; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #a89a86; font-weight: 700; font-size: 13px; white-space: nowrap;
  }
  .btn-eval.active-ok { border-color: #22c55e; background: #22c55e15; color: #16a34a; }
  .btn-eval.active-no { border-color: #ef4444; background: #ef444415; color: #dc2626; }
  .btn-mode {
    flex: 1; padding: 6px; border-radius: 8px; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #a89a86; font-weight: 700; font-size: 13px;
  }
  .btn-circle {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #a89a86; font-weight: 700; font-size: 13px; padding: 0;
  }
  .btn-sex, .btn-wordset, .btn-edu {
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #8a7d72; font-weight: 400; font-size: 13px;
  }

  /* Info box */
  .info-box {
    background: #f4efe4; border-radius: 10px; padding: 8px 12px;
    margin-bottom: 10px; font-size: 13px; color: #4a3f38;
  }

  /* Subhead label */
  .sublabel {
    font-size: 12px; color: #a89a86; letter-spacing: 1px;
    font-family: monospace; padding: 10px 0 4px; display: block;
  }

  /* Eval feedback */
  .eval-fb {
    border-radius: 8px; padding: 8px 12px;
    font-size: 12px; margin-top: 6px;
  }
  .eval-fb.ok { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
  .eval-fb.ko { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }

  /* Input */
  input[type=text], input[type=number] {
    width: 100%; border: 1.5px solid #e8e1ce; border-radius: 8px;
    padding: 7px 10px; font-size: 14px; outline: none;
    font-family: Georgia, serif; background: #faf6ec;
  }
  input[type=number] { font-family: monospace; }
  textarea {
    width: 100%; border: 1.5px solid #e8d5c5; border-radius: 8px;
    padding: 7px 10px; font-size: 13px; outline: none; resize: vertical;
    font-family: Georgia, serif; background: #faf6ec; color: #4a3f38;
  }

  /* Patient grid */
  .patient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .patient-grid .full { grid-column: 1 / -1; }
  .field-label {
    display: block; font-size: 11px; color: #a89a86;
    margin-bottom: 4px; letter-spacing: 1px; font-family: monospace;
  }

  /* RD row */
  .rd-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #ebe4d3;
  }
  .rd-word { flex: 1; font-size: 14px; color: #4a3f38; font-weight: 600; }
  .btn-rd {
    padding: 5px 11px; border-radius: 8px; border: 1.5px solid #e8e1ce;
    background: #faf6ec; color: #a89a86; font-weight: 400; font-size: 12px; white-space: nowrap;
  }

  /* Chips summary */
  .chips-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .rd-chip {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    font-weight: 700; font-family: monospace; border: 1px solid transparent;
  }

  /* Pistas box */
  .pistas-box {
    margin-top: 16px;
    background: linear-gradient(135deg, #f0f9ff, #ebe4d3);
    border: 1.5px solid #e8d5c5;
    border-radius: 12px; padding: 16px;
  }
  .pistas-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .pistas-title { font-size: 13px; font-weight: 800; color: #5a1414; letter-spacing: .5px; font-family: monospace; }
  .pistas-sub { font-size: 12px; color: #7a1f2b; margin-bottom: 6px; }
  .pistas-interp {
    background: #faf6ec; border: 1px solid #e8d5c5; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: #5a1414; line-height: 1.65; margin-bottom: 12px;
  }

  /* Summary block */
  .summary {
    background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
    border-radius: 16px; padding: 24px; color: #fff; margin-bottom: 20px;
  }
  .summary h3 { margin: 0 0 16px; font-size: 14px; letter-spacing: 3px; opacity: .7; font-family: monospace; }
  .sum-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .sum-cell { background: #ffffff15; border-radius: 10px; padding: 10px 14px; }
  .sum-cell .sc-lbl { font-size: 11px; opacity: .7; margin-bottom: 4px; }
  .sum-cell .sc-val { font-family: monospace; font-weight: 900; font-size: 20px; }
  .sum-cell .sc-val span { font-size: 12px; opacity: .5; }
  .sum-bottom { margin-top: 20px; border-top: 1px solid #ffffff30; padding-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  .sum-total-lbl { font-size: 11px; opacity: .6; letter-spacing: 2px; font-family: monospace; }
  .sum-total-num { font-size: 48px; font-weight: 900; font-family: monospace; line-height: 1; }
  .sum-total-num span { font-size: 20px; opacity: .5; }
  #sum-badge { border-radius: 12px; padding: 10px 20px; font-weight: 800; font-size: 16px; }

  /* Conclusion */
  .concl-card { background: #faf6ec; border-radius: 16px; box-shadow: 0 1px 4px #0001, 0 4px 24px #0002; margin-bottom: 20px; overflow: hidden; }
  .concl-head { background: linear-gradient(135deg, #1a1614, #4a3f38); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .concl-head-left { display: flex; align-items: center; gap: 10px; }
  .concl-head h3 { margin: 0; font-size: 15px; font-weight: 800; color: #fff; }
  #copy-btn { padding: 7px 18px; border-radius: 10px; background: #faf6ec; color: #1a1614; border: none; font-weight: 700; font-size: 13px; transition: all .2s; }
  #copy-btn.copied { background: #22c55e; color: #fff; }
  #concl-pre {
    margin: 0; padding: 16px 20px;
    font-size: 13px; line-height: 1.8;
    color: #1a1614; font-family: 'Courier New', monospace;
    background: #f4efe4;
    white-space: pre-wrap; word-break: break-word;
    border-top: 1px solid #e8e1ce;
  }

  @media (max-width: 520px) {
    .patient-grid { grid-template-columns: 1fr; }
    .patient-grid .full { grid-column: auto; }
    .sum-grid { grid-template-columns: 1fr 1fr; }
    .rd-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="sub">EVALUACIÓN NEUROPSICOLÓGICA</div>
    <h1>MMSE</h1>
    <div class="desc">Mini Mental State Examination interactivo</div>
    <div class="ref">Folstein et al. (1975) · Lobo et al. (1979)</div>
  </div>

  <div id="score-bar">
    <div class="top">
      <div>
        <div class="lbl">PUNTUACIÓN TOTAL</div>
        <div id="total-num">0<span>/30</span></div>
      </div>
      <div style="text-align:right">
        <div id="adj-label" style="display:none"></div>
        <div id="adj-cutoff" style="display:none"></div>
        <div id="adj-hint">Introduce edad y nivel de estudios para ver la clasificación ajustada</div>
      </div>
    </div>
    <div id="level-chips" style="display:none">
      <span class="level-chip" id="lc-normal">Normal</span>
      <span class="level-chip" id="lc-leve">Leve</span>
      <span class="level-chip" id="lc-mod">Moderado</span>
      <span class="level-chip" id="lc-grave">Grave</span>
      <span id="group-label"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-head" style="background:linear-gradient(135deg,#a89a8615,#a89a8608);border-bottom-color:#a89a8630">
      <div class="left"><span style="font-size:20px">👤</span><h3>Datos del paciente</h3></div>
    </div>
    <div class="card-body">
      <div class="patient-grid">
        <div class="full">
          <label class="field-label">NOMBRE COMPLETO</label>
          <input type="text" id="p-nombre" placeholder="Nombre y apellidos">
        </div>
        <div>
          <label class="field-label">FECHA DE EVALUACIÓN</label>
          <input type="text" id="p-fecha" placeholder="dd/mm/aaaa">
        </div>
        <div>
          <label class="field-label">F. NACIMIENTO</label>
          <input type="text" id="p-nacimiento" placeholder="dd/mm/aaaa">
        </div>
        <div>
          <label class="field-label">PROFESIÓN</label>
          <input type="text" id="p-profesion">
        </div>
        <div>
          <label class="field-label">EDAD (AÑOS) *</label>
          <input type="number" id="p-edad" min="0" max="120" placeholder="ej. 74">
        </div>
        <div>
          <label class="field-label">SEXO</label>
          <div style="display:flex;gap:8px;margin-top:2px">
            <button class="btn-sex" id="sex-V" onclick="setSex('V')" style="border-color:#2d6a9f;background:#2d6a9f15;color:#1e3a5f;font-weight:700">Varón</button>
            <button class="btn-sex" id="sex-M" onclick="setSex('M')">Mujer</button>
          </div>
        </div>
        <div class="full">
          <label class="field-label">NIVEL DE ESTUDIOS * <span style="color:#f59e0b;font-weight:700">(necesario para ajuste)</span></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px" id="edu-btns">
            <button class="btn-edu" onclick="setEdu(0)">Sin estudios</button>
            <button class="btn-edu" onclick="setEdu(1)">Primaria</button
